<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box1 {
            width: 200px;
            padding: 50px;
            border: 25px solid black;
            margin: 10px;
            background-color: lightblue;
        }

        .box2 {
            width: 300px;
            padding: 20px 15px 25px 10px;
            border: 5px solid black;
            margin: 20px 80px;
            background-color: lightblue
        }

        div>h2 {
            float: right;
        }
    </style>
</head>

<body>
    <p class="box1">"Do what you can, with what you have, where you are."</p>
    <br>
    <p class="box2">"Success is not final, failure is not fatal: it is the courage to continue that counts."</p>
    <br>
    <div>
        <h2>"It does not matter how slowly you go as long as you do not stop."</h2>
    </div>
    <br>
</body>

</html>
