<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box1 {
            width: 250px;
            padding: 40px;
            border: 15px solid black;
            margin: 15px;
            background-color: lightgreen;
        }

        .box2 {
            width: 350px;
            padding: 30px 20px 20px 15px;
            border: 8px solid black;
            margin: 25px 90px;
            background-color: rgb(9, 7, 7);
        }

        div>h2 {
            float: left;
        }
    </style>
</head>

<body>
    <p class="box1">"Believe you can and you're halfway there."</p>
    <br>
    <p class="box2">"Perseverance is not a long race; it is many short races one after the other."</p>
    <br>
    <div>
        <h2>"Your limitation—it’s only your imagination."</h2>
    </div>
    <br>
</body>

</html>
