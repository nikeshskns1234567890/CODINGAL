<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>intro to function in js</title>
</head>

<body>
    <p id="americaid"></p>
    <script>
        function greetingAndAsking() {
            console.log("hi sir good morning")
            console.log("may i use the washroom")
            console.log("please sir really urgent")
        }
        greetingAndAsking()

        function hitler(a, b, c) {
            console.log(a * a)
            console.log(b * b)
            console.log(c)
        }
        hitler(3, 4, "nikesh is a legend")

        function aadhya(a, b, c) {
            return a * b * c

        }
        var result = aadhya(2, 3, 4)
        console.log(result)

        function ronaldo() {
            document.getElementById("americaid").innerHTML = "cristiano ronaldo suiiiiiiiiiiiiiiiiii"
        }

        var h = 2022
        function messi() {
            console.log("messi won the world cup")
            console.log(h)
        }

        var q = function (a, b) {
            console.log("hi " + a + ", welcome to " + b);

        }
        q("rivaldo", "santiago")

    </script>
</body>

</html>
