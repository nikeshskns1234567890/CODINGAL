<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLLEGE APPLICATION</title>
</head>

<body>
    <!--forms in html-->
    <form>
        <fieldset>
            <label for="college name">college name</label>
            <input type="text" name="college name"><br>
            <p>Select your district:</p><br>
            <input type="radio" id="kancheepuram" name="district" value="kancheepuram">
            <label for="kancheepuram">Kancheepuram</label><br>

            <input type="radio" id="chengalpet" name="district" value="chengalpet">
            <label for="chengalpet">Chengalpet</label><br>

            <input type="radio" id="villupuram" name="district" value="villupuram">
            <label for="villupuram">Villupuram</label><br><br>

            <label for="phone number">phone number</label>
            <input type="number" name="age"><br><br>

            <label for="age">age</label>
            <input type="number" name="age"><br><br>

            <label for="dob">dob</label>
            <input type="date" name="date"><br><br>
        </fieldset>

        <fieldset>
            <label for="gender">gender</label>
            <input type="radio" name="gender" value="male">male
            <input type="radio" name="gender" value="female">female
        </fieldset>

        <fieldset>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
        </fieldset>

        <fieldset>

            <input type="submit" value="Submit">
        </fieldset>


    </form>
</body>

</html>
