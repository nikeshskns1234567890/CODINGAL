<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Explorers Hub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #2e8b57;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        li[title] {
            font-style: italic;
            color: goldenrod;
        }

        li:nth-child(2) {
            color: rgb(51, 69, 51);
        }

        li+li {
            border-top: 1px solid white;
        }

        .explore-btn:hover {
            background-color: darkkhaki;
            color: black;
            font-size: 1.2em;
        }

        .title::before {
            content: "🌿 ";
        }

        .title::after {
            content: " 🌎";
        }

        div:not(.mission) {
            border: 2px solid peru;
            padding: 10px;
        }

        p::first-letter {
            font-weight: bold;
            font-size: 1.8em;
        }
    </style>
</head>

<body>

    <header>
        <h1 class="title">🐾 Wildlife Explorers Hub</h1>
    </header>

    <section class="mission">
        <h2>Our Mission</h2>
        <p>Join us in protecting and discovering the wonders of nature!</p>
    </section>

    <button class="explore-btn">Discover the Wild</button>

    <ul class="explorer-list">
        <li title="Conservationist">om</li>
        <li title="Wildlife Expert">lenin</li>
        <li title="Nature Filmmaker">pranav</li>
    </ul>
    <div class="jungle">
        <p>Welcome to the jungle!</p>
    </div>

</body>
</html>
